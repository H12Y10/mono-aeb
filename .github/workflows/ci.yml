name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 统一 UTF-8：示例脚本会输出中文，而 Windows runner 默认 cp1252，
# 不加这个会让 print 直接抛 UnicodeEncodeError；顺带让日志可读。
env:
  PYTHONUTF8: "1"

jobs:
  core-tests:
    name: 核心链路测试（${{ matrix.os }} / py${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只装「零数据 demo + 核心链路」所需依赖：检测后端是可选 extra（ultralytics → torch ~2GB），
      # --check / --demo / 测试套件都不需要，故不装；--no-deps 用于显式装 headless opencv 并回退 lapx。
      # 缺少 lap wheel 时按 README 改装 lapx（其提供的模块名即 lap）；第 38 行即安装期替换。
      - name: 安装核心依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy opencv-python-headless pytest pytest-cov
          pip install lap || pip install lapx
          pip install -e . --no-deps

      - name: 依赖自检
        run: python examples/quickstart.py --check

      - name: 零数据 demo（NORMAL → ATTENTION → FCW → AEB）
        run: python examples/quickstart.py --demo

      - name: pytest（含覆盖率表）
        run: pytest -q --cov=aeb --cov-report=term-missing

  full-install:
    name: 完整安装路径（含可选检测后端 yolo + dev extra）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 走完整依赖解析（含 yolo extra 的 ultralytics → torch），并带上 dev extra（pytest）；
      # 若只装 `-e .` 则没有检测后端，也没有 pytest。
      - name: pip install -e ".[yolo,dev]"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[yolo,dev]"

      - name: YOLOv8 后端可导入
        run: python -c "from aeb.detectors import YOLOv8Detector, COCO_TO_AEB; print('YOLOv8 后端 OK')"

      - name: 依赖自检（检测依赖亦应就绪）
        run: python examples/quickstart.py --check

      - name: pytest（含覆盖率表）
        run: pytest -q --cov=aeb --cov-report=term-missing

  lint:
    name: Lint 与格式化（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 版本固定在 pyproject.toml / .pre-commit-config.yaml 的同一版本，
      # 避免 ruff 升级后规则集漂移导致 CI 无故变红。
      - name: 安装 ruff
        run: pip install ruff==0.16.10

      - name: ruff check（lint）
        run: ruff check --output-format=github .

      - name: ruff format --check（格式化）
        run: ruff format --check .
