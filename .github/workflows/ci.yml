name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Force UTF-8 for all steps: Windows runners default to cp1252, while non-ASCII text
# can still reach stdout — test diagnostics, messages coming from third-party
# libraries, user-supplied file paths — where print() would then raise
# UnicodeEncodeError.
env:
  PYTHONUTF8: "1"

jobs:
  core-tests:
    name: core tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Install only what the zero-data demo and the core chain need: the detector
      # backends are optional extras (ultralytics -> torch, ~2 GB) that neither
      # --check / --demo nor the test suite uses. --no-deps installs the package
      # without resolving dependencies, because the headless OpenCV is pinned above
      # and lap falls back to lapx (which provides the module name `lap`).
      - name: Install core dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy opencv-python-headless pytest pytest-cov
          pip install lap || pip install lapx
          pip install -e . --no-deps

      - name: Dependency self-check
        run: python examples/quickstart.py --check

      - name: Zero-data demo (NORMAL -> ATTENTION -> FCW -> AEB)
        run: python examples/quickstart.py --demo

      - name: pytest (with coverage table)
        run: pytest -q --cov=aeb --cov-report=term-missing

  full-install:
    name: full install (yolo + dev extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Full dependency resolution, including the yolo extra (ultralytics -> torch)
      # and the dev extra (pytest); a plain `-e .` would install neither.
      - name: pip install -e ".[yolo,dev]"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[yolo,dev]"

      - name: YOLOv8 backend importable
        run: python -c "from aeb.detectors import YOLOv8Detector, COCO_TO_AEB; print('YOLOv8 backend OK')"

      - name: Dependency self-check (detector dependencies present)
        run: python examples/quickstart.py --check

      - name: pytest (with coverage table)
        run: pytest -q --cov=aeb --cov-report=term-missing

  lint:
    name: lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The ruff version is pinned here and in .pre-commit-config.yaml (rev), so the
      # two stay on the same rule set; pyproject.toml only configures the rules and
      # pins no version.
      - name: Install ruff
        run: pip install ruff==0.16.10

      - name: ruff check (lint)
        run: ruff check --output-format=github .

      - name: ruff format --check (formatting)
        run: ruff format --check .
