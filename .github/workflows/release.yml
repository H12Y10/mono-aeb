name: Release

# On a v* tag: build the sdist and wheel and attach both to the matching GitHub
# Release. Publishing to PyPI is separate: configure the Trusted Publisher on PyPI,
# then trigger this workflow manually (workflow_dispatch) — a tag push never uploads
# to PyPI by itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: twine check (metadata / README rendering)
        run: twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    name: attach to the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # This job does not check out the repository, so gh cannot infer it from the
      # working directory — pass --repo explicitly.
      - name: Ensure the Release exists, then upload the sdist / wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fresh tag may not have a Release yet: check first, create it if it is
          # missing, then upload the artifacts.
          gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" \
                 --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${{ github.repository }}" --clobber

  pypi-publish:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    # Manual runs only, so pushing a tag can never publish to PyPI by accident
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mono-aeb
    permissions:
      id-token: write # Trusted Publishing uses OIDC; no API token required
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
