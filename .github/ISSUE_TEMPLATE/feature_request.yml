name: Feature request
description: Propose a capability, a new detector backend, or a change to an existing one
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/H12Y10/mono-aeb/blob/main/ROADMAP.md) first —
        some things are deliberately out of scope (vehicle control, shipping weights or data).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - decision chain (ranging / TTC / state machine / in-path)
        - tracking
        - detector backend
        - packaging, CLI or container
        - documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation you are in, not only the API you would like.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: If it changes a public contract (aeb/types.py, BaseDetector, config defaults, CLI), say so.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints to keep in mind
      options:
        - label: The default test suite stays zero-data (no video, no weights, no network).
        - label: The default install stays free of torch / ultralytics.
