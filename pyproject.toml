[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mono-aeb"
version = "0.1.0"
description = "检测器无关的单目 AEB 前向碰撞预警决策链：检测→跟踪→测距→TTC→风险决策（免标定尺度 TTC）"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "aeb/tracker/vendor/bytetrack/LICENSE"]
authors = [{ name = "mono-aeb contributors" }]
keywords = ["AEB", "FCW", "forward-collision-warning", "monocular", "time-to-collision", "TTC", "autonomous-driving"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "scipy",
    "lap",
    "opencv-python",
]

[project.optional-dependencies]
yolo = ["ultralytics"]
dfine = ["torch", "torchvision", "pillow"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/H12Y10/mono-aeb"
Repository = "https://github.com/H12Y10/mono-aeb"
Issues = "https://github.com/H12Y10/mono-aeb/issues"

[tool.setuptools.packages.find]
include = ["aeb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# vendored ByteTrack（MIT）的许可证原文随包分发，与 dist-info/licenses 下的副本并存，
# 保证「源码旁边就有它自己的许可声明」，满足 MIT 的保留声明要求。
[tool.setuptools.package-data]
"aeb.tracker.vendor.bytetrack" = ["LICENSE"]
